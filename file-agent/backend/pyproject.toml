[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileagent"
version = "0.1.0"
description = "Local-first AI file organization agent (Python sidecar)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simone Agazzi" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "watchdog>=4.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rapidfuzz>=3.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
fileagent = "fileagent.main:main"

[tool.setuptools.packages.find]
include = ["fileagent*"]

[tool.setuptools.package-data]
fileagent = ["schema.sql", "seeds/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
