name: ROI Dashboard CI

on:
  pull_request:
    paths:
      - "roi-dashboard/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "roi-dashboard/**"
      - ".github/workflows/ci.yml"

jobs:
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roi-dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: roi-dashboard/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roi-dashboard/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' httpx 'fastapi[standard]'
      - run: ruff check .
      - run: pytest -q
